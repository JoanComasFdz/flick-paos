<html lang="es">

<style>
  html, body { margin: 0; }
  .og {
    width: 1200px; height: 630px; box-sizing: border-box; overflow: hidden;

  .main {
    font-family: "Permanent Marker", cursive; font-size: 104px; line-height: 1.15; color: #F5C518;

    text-shadow: 0 6px 0 #6B4E00, 0 10px 0 #000, 0 14px 20px rgba(0,0,0,.6);
  }
  .sub { margin-top: 26px; font-weight: 600; font-size: 40px; letter-spacing: 2px; color: #C9D4E8; text-transform: uppercase; }
