<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1730">
  <meta name="description" content="Clasificación de la Liga de los Flick-Paos">
  <title>La Liga de los Flick-Paos</title>
  <link rel="icon" href="assets/crest.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" crossorigin="anonymous"
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Permanent+Marker&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/+esm" crossorigin>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="sticky-head">
  <header class="topbar">
    <img class="topbar-crest" src="assets/crest.svg" alt="">
    <a class="topbar-title" href="#/" data-i18n-html="appTitle">Liga de los <span>Flick-Paos</span></a>
    <label for="season" class="visually-hidden" hidden data-i18n="season">Temporada</label>
    <select id="season" hidden></select>
    <div class="langs" role="group" aria-label="Idioma / Idioma">
      <button type="button" class="lang" data-lang="es" aria-label="Español" title="Español">
        <svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/></svg>
      </button>
      <button type="button" class="lang" data-lang="ca" aria-label="Català" title="Català">
        <svg viewBox="0 0 27 18" aria-hidden="true"><rect width="27" height="18" fill="#FCDD09"/><path d="M0 3h27M0 7h27M0 11h27M0 15h27" stroke="#DA121A" stroke-width="2"/></svg>
      </button>
    </div>
  </header>
  <nav class="tabs" aria-label="Secciones">
    <a href="#/" data-tab="standings" data-i18n="standings">Clasificación</a>
    <a href="#/historial" data-tab="history" data-i18n="history">Historial</a>
    <a href="#/normas" data-tab="rules" data-i18n="rules">Normas</a>
  </nav>
  </div>

  <main id="view" aria-live="polite">
    <div class="loading" role="status"><div class="spinner"></div><p data-i18n="loading">Cargando la liga…</p></div>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <dialog id="pin-dialog" aria-labelledby="pin-title">
    <form method="dialog">
      <h2 id="pin-title">PIN</h2>
      <p data-i18n="pinText">Introduce el PIN del grupo para añadir o editar jornadas.</p>
      <p class="pin-error form-error" role="alert" hidden></p>
      <label for="pin-input" class="visually-hidden">PIN</label>
      <input id="pin-input" class="input" type="password" inputmode="numeric" autocomplete="off" required>
      <div class="dialog-actions">
        <button class="btn" value="cancel" formnovalidate data-i18n="cancel">Cancelar</button>
        <button class="btn btn-primary" value="ok" data-i18n="accept">Aceptar</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <p></p>
      <div class="dialog-actions">
        <button class="btn" value="cancel" data-i18n="cancel">Cancelar</button>
        <button class="btn btn-danger" value="ok">Aceptar</button>
      </div>
    </form>
  </dialog>
</body>
</html>
